# Static host for the built app. Upstream serves the same dist/ from a
# Cloudflare Worker with no script; the behaviour that matters to the app is
# that every unknown path lands on index.html (wrangler.jsonc:
# "single-page-application"), so a stale asset URL or a deep link still opens
# the app instead of a 404.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # The bundle is a few megabytes of geometry code plus a WASM CAD kernel;
    # compressing it is the difference between a usable and an annoying load
    # over a LAN. wasm is served as application/wasm (nginx's mime.types has
    # carried it since 1.21) — the browser will not stream-compile it without.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Container health: no disk, no upstream, no log noise.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything it emits into assets/, so those files are
    # immutable; re-fetching them is wasted bandwidth, keeping them is free.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current hashed
    # bundle, and a cached copy is how a deployment appears not to happen.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
