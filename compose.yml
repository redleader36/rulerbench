#
# docker compose up -d  →  http://localhost:8080
#
# No volumes and no environment: the app is entirely client-side, so there is
# no state on the server to keep. Pin an exact version instead of `latest` if
# you would rather a restart never surprise you.
services:
  rulerbench:
    image: ghcr.io/redleader36/rulerbench:latest
    container_name: rulerbench
    restart: unless-stopped
    ports:
      - "8080:8080"
    # The image runs as uid 101 (nginx) and needs nothing but its own rootfs.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
